[package]
name = "webproxy-toolkit"
version = "0.1.0"
description = "Local HTTP/HTTPS testing proxy toolkit"
authors = ["you"]
edition = "2021"

[lib]
name = "webproxy_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
httparse = "1"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
url = "2"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
futures-util = "0.3"
webpki-roots = "0.26"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
