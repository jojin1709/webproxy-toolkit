name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # SignPath Foundation (free code signing for open source).
    # These stay empty until the project is approved at https://signpath.org
    # and the values are added as repo secrets. Left empty, the signing steps
    # are skipped and the release builds exactly as before.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIG_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        working-directory: app
        run: npm run tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*-setup.exe" release/
          Get-ChildItem release

      # SignPath needs the unsigned installer as a GitHub Actions artifact so
      # it can verify the binary was built by CI from the open-source repo.
      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: webproxy-toolkit-setup-unsigned
          path: release/*.exe
          if-no-files-found: error

      # Signs the installer via SignPath Foundation so Windows shows a real
      # publisher instead of "Unknown publisher" and SmartScreen stops warning.
      # Skipped until the SIGNPATH_* secrets above are configured.
      - name: Sign installer (SignPath Foundation — free for open source)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ github.token }}
          output-artifact-directory: signed
          wait-for-completion: true

      # Replace the unsigned installer with the signed one before release.
      - name: Use signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Get-ChildItem signed/*.exe | ForEach-Object { Copy-Item $_.FullName release/ -Force }
          Get-ChildItem release

      - name: Verify signature
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webproxy-toolkit-setup
          path: release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
